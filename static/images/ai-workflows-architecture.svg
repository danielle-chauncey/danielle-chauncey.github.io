<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Inter, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="900" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">AI-Native Marketing Operations: Three Systems</text>

  <!-- System 1: MCP Document Workflows -->
  <rect x="30" y="55" width="260" height="330" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="30" y="55" width="260" height="40" rx="8" fill="#2563eb"/>
  <rect x="30" y="85" width="260" height="10" fill="#2563eb"/>
  <text x="160" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">MCP DOCUMENT WORKFLOWS</text>

  <!-- Inputs -->
  <rect x="50" y="110" width="90" height="30" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="95" y="129" text-anchor="middle" font-size="9" fill="#1e40af">Sales Data</text>
  <rect x="150" y="110" width="90" height="30" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="195" y="129" text-anchor="middle" font-size="9" fill="#1e40af">Account History</text>
  <rect x="50" y="148" width="90" height="30" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="95" y="167" text-anchor="middle" font-size="9" fill="#1e40af">Legal/Compliance</text>
  <rect x="150" y="148" width="90" height="30" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="195" y="167" text-anchor="middle" font-size="9" fill="#1e40af">Product Teams</text>

  <!-- Arrow -->
  <path d="M160 185 L160 200 L150 200 L160 212 L170 200 L160 200" fill="#2563eb"/>

  <!-- Agent -->
  <rect x="70" y="218" width="180" height="45" rx="6" fill="#2563eb" opacity="0.15" stroke="#2563eb" stroke-width="1"/>
  <text x="160" y="237" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Claude + MCP Servers</text>
  <text x="160" y="252" text-anchor="middle" font-size="9" fill="#1e40af">Orchestrate, retrieve, format</text>

  <!-- Arrow -->
  <path d="M160 268 L160 283 L150 283 L160 295 L170 283 L160 283" fill="#2563eb"/>

  <!-- Output -->
  <rect x="70" y="300" width="180" height="40" rx="6" fill="#2563eb" opacity="0.9"/>
  <text x="160" y="317" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">Executive Briefing</text>
  <text x="160" y="332" text-anchor="middle" font-size="9" fill="#ffffff">24-hour turnaround</text>

  <!-- Result -->
  <text x="160" y="370" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">70% of ops automated</text>

  <!-- System 2: RAG Knowledge Base -->
  <rect x="320" y="55" width="260" height="330" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="320" y="55" width="260" height="40" rx="8" fill="#7c3aed"/>
  <rect x="320" y="85" width="260" height="10" fill="#7c3aed"/>
  <text x="450" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">RAG KNOWLEDGE BASE</text>

  <!-- Input -->
  <rect x="345" y="110" width="210" height="35" rx="4" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="450" y="127" text-anchor="middle" font-size="10" fill="#5b21b6">14,000+ files</text>
  <text x="450" y="140" text-anchor="middle" font-size="9" fill="#7c3aed">Guides, docs, standards, processes</text>

  <!-- Arrow -->
  <path d="M450 152 L450 167 L440 167 L450 179 L460 167 L450 167" fill="#7c3aed"/>

  <!-- Pipeline -->
  <rect x="345" y="185" width="210" height="35" rx="4" fill="#7c3aed" opacity="0.15" stroke="#7c3aed" stroke-width="1"/>
  <text x="450" y="203" text-anchor="middle" font-size="10" font-weight="500" fill="#5b21b6">Ingest → Chunk → Embed → Index</text>
  <text x="450" y="216" text-anchor="middle" font-size="9" fill="#7c3aed">Python + vector storage</text>

  <!-- Arrow -->
  <path d="M450 225 L450 240 L440 240 L450 252 L460 240 L450 240" fill="#7c3aed"/>

  <!-- Retrieval -->
  <rect x="345" y="258" width="210" height="35" rx="4" fill="#7c3aed" opacity="0.15" stroke="#7c3aed" stroke-width="1"/>
  <text x="450" y="276" text-anchor="middle" font-size="10" font-weight="500" fill="#5b21b6">Query → Retrieve → Rank → Answer</text>
  <text x="450" y="289" text-anchor="middle" font-size="9" fill="#7c3aed">Natural language interface</text>

  <!-- Arrow -->
  <path d="M450 298 L450 313 L440 313 L450 325 L460 313 L450 313" fill="#7c3aed"/>

  <!-- Output -->
  <rect x="360" y="330" width="180" height="30" rx="6" fill="#7c3aed" opacity="0.9"/>
  <text x="450" y="349" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">Conversational retrieval</text>

  <!-- Result -->
  <text x="450" y="370" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">14K files searchable</text>

  <!-- System 3: LLM Editorial Governance -->
  <rect x="610" y="55" width="260" height="330" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="610" y="55" width="260" height="40" rx="8" fill="#059669"/>
  <rect x="610" y="85" width="260" height="10" fill="#059669"/>
  <text x="740" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">LLM EDITORIAL GOVERNANCE</text>

  <!-- Input -->
  <rect x="635" y="110" width="210" height="35" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="740" y="127" text-anchor="middle" font-size="10" fill="#065f46">Contributor draft</text>
  <text x="740" y="140" text-anchor="middle" font-size="9" fill="#059669">Any of 300+ authors</text>

  <!-- Arrow -->
  <path d="M740 152 L740 167 L730 167 L740 179 L750 167 L740 167" fill="#059669"/>

  <!-- LLM Review -->
  <rect x="635" y="185" width="210" height="45" rx="4" fill="#059669" opacity="0.15" stroke="#059669" stroke-width="1"/>
  <text x="740" y="203" text-anchor="middle" font-size="10" font-weight="500" fill="#065f46">LLM trained on style guide</text>
  <text x="740" y="218" text-anchor="middle" font-size="9" fill="#059669">Tone, terminology, structure</text>
  <text x="740" y="230" text-anchor="middle" font-size="9" fill="#059669">checks in seconds</text>

  <!-- Arrow -->
  <path d="M740 235 L740 250 L730 250 L740 262 L750 250 L740 250" fill="#059669"/>

  <!-- CI/CD -->
  <rect x="635" y="268" width="210" height="35" rx="4" fill="#059669" opacity="0.15" stroke="#059669" stroke-width="1"/>
  <text x="740" y="286" text-anchor="middle" font-size="10" font-weight="500" fill="#065f46">CI/CD pipeline linting</text>
  <text x="740" y="299" text-anchor="middle" font-size="9" fill="#059669">Automated gatekeep before publish</text>

  <!-- Arrow -->
  <path d="M740 308 L740 323 L730 323 L740 335 L750 323 L740 323" fill="#059669"/>

  <!-- Output -->
  <rect x="650" y="340" width="180" height="25" rx="6" fill="#059669" opacity="0.9"/>
  <text x="740" y="357" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">Publish (governed)</text>

  <!-- Result -->
  <text x="740" y="370" text-anchor="middle" font-size="11" font-weight="600" fill="#1a1a1a">25% relevance improvement</text>

  <!-- Bottom connector line -->
  <line x1="160" y1="395" x2="740" y2="395" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="450" y="412" text-anchor="middle" font-size="11" font-weight="500" fill="#6b7280">All three systems operational daily. Built by one person. No engineering support.</text>
</svg>
