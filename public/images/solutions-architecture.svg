<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="900" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">Content Architecture: Domain → Category → Use Case → Solution</text>

