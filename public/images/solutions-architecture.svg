  <text x="70" y="110" font-size="13" font-weight="600" fill="#ffffff">Financial Services  •  Healthcare  •  Analytics  •  IoT  •  Machine Learning  •  Media</text>

  <!-- Arrow down -->
  <path d="M450 130 L450 150 L440 150 L450 165 L460 150 L450 150" fill="#666"/>

  <!-- Category Level -->
  <rect x="50" y="170" width="380" height="70" rx="8" fill="#2563eb" opacity="0.9"/>
