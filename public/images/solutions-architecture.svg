  <text x="490" y="218" font-size="13" font-weight="600" fill="#ffffff">Privacy-Enhanced Collaboration</text>

  <!-- Arrows down -->
  <path d="M240 240 L240 260 L230 260 L240 275 L250 260 L240 260" fill="#666"/>
  <path d="M660 240 L660 260 L650 260 L660 275 L670 260 L660 260" fill="#666"/>

