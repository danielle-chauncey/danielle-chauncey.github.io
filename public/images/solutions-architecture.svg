  <text x="65" y="320" font-size="12" font-weight="600" fill="#ffffff">Payment Processing</text>

  <rect x="240" y="280" width="170" height="60" rx="6" fill="#7c3aed" opacity="0.85"/>
  <text x="255" y="300" font-size="10" font-weight="500" fill="#ffffff" opacity="0.7">USE CASE</text>
  <text x="255" y="320" font-size="12" font-weight="600" fill="#ffffff">Customer 360</text>

  <rect x="470" y="280" width="170" height="60" rx="6" fill="#7c3aed" opacity="0.85"/>
  <text x="485" y="300" font-size="10" font-weight="500" fill="#ffffff" opacity="0.7">USE CASE</text>
  <text x="485" y="320" font-size="12" font-weight="600" fill="#ffffff">Clean Room Analytics</text>

  <rect x="660" y="280" width="170" height="60" rx="6" fill="#7c3aed" opacity="0.85"/>
  <text x="675" y="300" font-size="10" font-weight="500" fill="#ffffff" opacity="0.7">USE CASE</text>
  <text x="675" y="320" font-size="12" font-weight="600" fill="#ffffff">Federated Learning</text>

  <!-- Arrows down -->
  <path d="M135 340 L135 360 L125 360 L135 375 L145 360 L135 360" fill="#666"/>
  <path d="M325 340 L325 360 L315 360 L325 375 L335 360 L325 360" fill="#666"/>

  <!-- Solution Level -->
  <rect x="50" y="380" width="130" height="55" rx="5" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="65" y="400" font-size="9" font-weight="500" fill="#666">SOLUTION</text>
  <text x="65" y="418" font-size="11" font-weight="600" fill="#1a1a1a">Implementation</text>
  <text x="65" y="432" font-size="11" font-weight="600" fill="#1a1a1a">Guide</text>

  <rect x="200" y="380" width="130" height="55" rx="5" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="215" y="400" font-size="9" font-weight="500" fill="#666">SOLUTION</text>
  <text x="215" y="418" font-size="11" font-weight="600" fill="#1a1a1a">Architecture</text>
  <text x="215" y="432" font-size="11" font-weight="600" fill="#1a1a1a">Diagram</text>

  <rect x="350" y="380" width="130" height="55" rx="5" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="365" y="400" font-size="9" font-weight="500" fill="#666">SOLUTION</text>
  <text x="365" y="418" font-size="11" font-weight="600" fill="#1a1a1a">Deployment</text>
